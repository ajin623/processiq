[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "processiq"
version = "0.1.0"
description = "Purchase-to-pay process intelligence and decision-support analysis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Ajin Babu" }
]
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pm4py==2.7.23.8",
    "scipy==1.18.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
